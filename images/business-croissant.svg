<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="crateWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5420"/>
      <stop offset="1" stop-color="#6b3f18"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d4"/>
      <stop offset="1" stop-color="#e3d5b0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg2)"/>

  <!-- delivery crate -->
  <g transform="translate(600,540)">
    <rect x="-360" y="-40" width="720" height="220" rx="10" fill="url(#crateWood)"/>
    <rect x="-360" y="-40" width="720" height="30" fill="#5c3414"/>
    <g stroke="#5c3414" stroke-width="6" opacity="0.6">
      <line x1="-280" y1="-40" x2="-280" y2="180"/>
      <line x1="-140" y1="-40" x2="-140" y2="180"/>
      <line x1="0" y1="-40" x2="0" y2="180"/>
      <line x1="140" y1="-40" x2="140" y2="180"/>
      <line x1="280" y1="-40" x2="280" y2="180"/>
    </g>

    <!-- paper wrap -->
    <path d="M-330,-40 L330,-40 L300,-140 L-300,-140 Z" fill="#f2e8d4" opacity="0.94"/>
    <path d="M-300,-140 L300,-140 L280,-190 L-280,-190 Z" fill="#efe4d0" opacity="0.94"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Frank Ruhl Libre, serif" font-size="26" letter-spacing="2" fill="#2c2620">FRESH DAILY</text>
  </g>

  <!-- large croissant hero shape -->
  <g transform="translate(600,330) scale(2.6)">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z" fill="#e3a24d"/>
    <path d="M-70,4 C-58,-38 -10,-56 30,-24" fill="none" stroke="#a2652a" stroke-width="3" opacity="0.6"/>
    <path d="M-50,32 C-40,4 -6,-8 18,6" fill="none" stroke="#a2652a" stroke-width="2.4" opacity="0.5"/>
  </g>

  <!-- flour dust -->
  <g fill="#fff" opacity="0.5">
    <circle cx="360" cy="220" r="4"/>
    <circle cx="420" cy="260" r="3"/>
    <circle cx="800" cy="210" r="4"/>
    <circle cx="860" cy="250" r="3"/>
    <circle cx="600" cy="160" r="3"/>
  </g>

  <!-- small croissants beside crate -->
  <g transform="translate(230,660) scale(0.7)" fill="#d99a4f">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z"/>
  </g>
  <g transform="translate(980,660) scale(0.7) rotate(20)" fill="#eab26a">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z"/>
  </g>
</svg>
