<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a24"/>
      <stop offset="1" stop-color="#3c2517"/>
    </linearGradient>
    <linearGradient id="croissantG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a24d"/>
      <stop offset="1" stop-color="#b5732b"/>
    </linearGradient>
    <linearGradient id="croissantG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eab26a"/>
      <stop offset="1" stop-color="#c07f34"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#wood)"/>
  <g opacity="0.12" stroke="#000" stroke-width="2">
    <line x1="0" y1="120" x2="1600" y2="100"/>
    <line x1="0" y1="340" x2="1600" y2="360"/>
    <line x1="0" y1="560" x2="1600" y2="540"/>
    <line x1="0" y1="780" x2="1600" y2="800"/>
  </g>

  <!-- scattered croissants -->
  <g transform="translate(220,260) rotate(-18)">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z" fill="url(#croissantG)"/>
    <path d="M-70,4 C-58,-38 -10,-56 30,-24" fill="none" stroke="#8a5420" stroke-width="3" opacity="0.5"/>
  </g>

  <g transform="translate(560,180) rotate(10) scale(1.15)">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z" fill="url(#croissantG2)"/>
    <path d="M-70,4 C-58,-38 -10,-56 30,-24" fill="none" stroke="#8a5420" stroke-width="3" opacity="0.5"/>
  </g>

  <g transform="translate(950,320) rotate(-40) scale(0.9)">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z" fill="url(#croissantG)"/>
  </g>

  <g transform="translate(1280,200) rotate(28) scale(1.05)">
    <path d="M-90,10 C-70,-70 10,-90 60,-40 C90,-8 90,40 50,60 C60,20 40,-10 0,-14 C-40,-18 -60,10 -50,50 C-80,40 -100,50 -90,10 Z" fill="url(#croissantG2)"/>
  </g>

  <!-- pastry / bun row -->
  <g fill="#d99a4f">
    <circle cx="180" cy="700" r="70"/>
    <circle cx="330" cy="740" r="55"/>
    <circle cx="470" cy="690" r="64"/>
  </g>
  <g fill="none" stroke="#8a5420" stroke-width="3" opacity="0.5">
    <path d="M130,690 q50,-30 100,0"/>
    <path d="M295,730 q35,-22 70,0"/>
    <path d="M420,680 q50,-28 100,0"/>
  </g>

  <!-- bread loaf -->
  <g transform="translate(1150,700)">
    <ellipse cx="0" cy="40" rx="220" ry="60" fill="#3c2517" opacity="0.3"/>
    <path d="M-200,20 C-200,-60 -100,-100 0,-100 C100,-100 200,-60 200,20 C200,70 100,90 0,90 C-100,90 -200,70 -200,20 Z" fill="#c98a45"/>
    <path d="M-160,-10 C-100,-46 100,-46 160,-10" fill="none" stroke="#8a5420" stroke-width="4" opacity="0.55"/>
    <path d="M-140,30 C-80,0 80,0 140,30" fill="none" stroke="#8a5420" stroke-width="4" opacity="0.4"/>
  </g>

  <rect width="1600" height="1000" fill="#000" opacity="0.06"/>
</svg>
