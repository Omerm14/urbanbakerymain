<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#e7dbbd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <rect y="620" width="1200" height="280" fill="#c9bd9c"/>
  <rect y="612" width="1200" height="10" fill="#a89a72"/>

  <!-- building body -->
  <rect x="140" y="180" width="920" height="450" fill="#6d7a5c"/>
  <rect x="140" y="180" width="920" height="18" fill="#57614a"/>
  <rect x="140" y="600" width="920" height="30" fill="#4f5a41"/>

  <!-- windows row -->
  <g fill="#f3ead6" stroke="#3d4432" stroke-width="4">
    <rect x="200" y="250" width="140" height="180" rx="4"/>
    <rect x="380" y="250" width="140" height="180" rx="4"/>
    <rect x="680" y="250" width="140" height="180" rx="4"/>
    <rect x="860" y="250" width="140" height="180" rx="4"/>
  </g>
  <g stroke="#3d4432" stroke-width="3">
    <line x1="270" y1="250" x2="270" y2="430"/>
    <line x1="450" y1="250" x2="450" y2="430"/>
    <line x1="750" y1="250" x2="750" y2="430"/>
    <line x1="930" y1="250" x2="930" y2="430"/>
    <line x1="200" y1="340" x2="340" y2="340"/>
    <line x1="380" y1="340" x2="520" y2="340"/>
    <line x1="680" y1="340" x2="820" y2="340"/>
    <line x1="860" y1="340" x2="1000" y2="340"/>
  </g>

  <!-- door -->
  <rect x="530" y="330" width="140" height="300" fill="#3d4432"/>
  <rect x="545" y="350" width="50" height="260" fill="#f3ead6" opacity="0.85"/>
  <rect x="605" y="350" width="50" height="260" fill="#f3ead6" opacity="0.85"/>
  <circle cx="595" cy="480" r="4" fill="#2c2620"/>

  <!-- awning -->
  <g>
    <rect x="500" y="270" width="200" height="18" fill="#b5592e"/>
    <path d="M500,288 L700,288 L680,340 L520,340 Z" fill="#b5592e"/>
    <g fill="#f3ead6" opacity="0.5">
      <path d="M520,288 l20,0 -14,52 -20,0 Z"/>
      <path d="M568,288 l20,0 -14,52 -20,0 Z"/>
      <path d="M616,288 l20,0 -14,52 -20,0 Z"/>
      <path d="M664,288 l20,0 -14,52 -20,0 Z"/>
    </g>
  </g>

  <!-- sign -->
  <rect x="470" y="210" width="260" height="46" rx="6" fill="#f3ead6" stroke="#3d4432" stroke-width="3"/>
  <text x="600" y="240" text-anchor="middle" font-family="Frank Ruhl Libre, serif" font-size="22" letter-spacing="3" fill="#3d4432">URBAN BAKERY</text>

  <!-- planters -->
  <g>
    <rect x="150" y="600" width="60" height="34" fill="#8a5420"/>
    <circle cx="180" cy="595" r="34" fill="#4f5a41"/>
    <circle cx="160" cy="580" r="22" fill="#57614a"/>
    <circle cx="205" cy="585" r="24" fill="#57614a"/>

    <rect x="990" y="600" width="60" height="34" fill="#8a5420"/>
    <circle cx="1020" cy="595" r="34" fill="#4f5a41"/>
    <circle cx="1000" cy="580" r="22" fill="#57614a"/>
    <circle cx="1045" cy="585" r="24" fill="#57614a"/>
  </g>

  <!-- pavement -->
  <g stroke="#a89a72" stroke-width="2" opacity="0.6">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="780" x2="1200" y2="780"/>
    <line x1="0" y1="860" x2="1200" y2="860"/>
  </g>
</svg>
